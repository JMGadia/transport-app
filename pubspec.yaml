name: transport_app
description: Transport Schedule & Vehicle Request Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6

  # State management (kept simple — Provider is lightweight and easy to swap later)
  provider: ^6.1.1

  # For formatting dates, currency, and times
  intl: ^0.19.0

  # Useful for future backend wiring (HTTP requests to your API)
  # http: ^1.2.0

  # Useful for local storage if you decide to cache data offline later
  # shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
